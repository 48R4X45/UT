; Default settings for the AutoBot package.
; Copy to <UT2004>\System\AutoBot.ini (scripts/build.sh does this if the file is missing).
; Note: UT2004 INI files do not support inline comments at the end of a value line.

[AutoBot.AutoBotMutator]
BotSkill=6.0
Aggression=0.6
StrafeAbility=0.8
AccuracyBonus=0.5
bHuntItems=True
TuneInterval=1.0

[AutoBot.AutoBotController]
RetreatHealth=40.0
WeightFight=1.0
WeightGrabItem=0.8
WeightRoam=0.5
WeightRetreat=1.5
ThinkInterval=0.5
bDebugLog=False
